<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProHydro CAD v4.0 - Modularer Bewässerungsplaner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Link-Banner bei geladenem Plan -->
    <div id="toast-msg" class="toast"></div>

    <div id="toolbar">
        <h2>ProHydro CAD</h2>
        
        <div class="tool-group">
            <label>1. Datei & Maßstab</label>
            <label class="file-btn">📁 Bild hochladen <input type="file" id="img-upload" accept="image/*" style="display:none;"></label>
            <button id="btn-scale">📏 Maßstab ziehen</button>
        </div>

        <div class="tool-group">
            <label>2. Flächen (Punkte & Kurven)</label>
            <button id="btn-draw-lawn">🟩 Rasen abstecken</button>
            <button id="btn-draw-drip">💧 Tropfzone abstecken</button>
        </div>

        <div class="tool-group">
            <label>3. Bauteile</label>
            <button id="btn-add-source">🚰 Wasserquelle</button>
            <button id="btn-add-sprinkler">🎯 Regner setzen</button>
        </div>

        <div class="tool-group">
            <label>Modus & Aktionen</label>
            <button id="btn-select" class="active">🖐️ Bearbeiten / Anpacken</button>
            <button id="btn-delete" style="color: #ff5555;">🗑️ Objekt löschen</button>
        </div>

        <div class="tool-group" style="margin-top: auto;">
            <label>Speichern & Teilen</label>
            <button id="btn-share" style="background: var(--accent); font-weight: bold;">🔗 Link & Code erstellen</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
        <div id="status-bar">Mausrad: Zoomen | Leertaste + Drag: Verschieben | Doppelklick: Fläche schließen</div>
    </div>

    <div id="sidebar">
        <div class="card">
            <h3>System-Status</h3>
            <div class="prop-row"><span>Maßstab:</span> <strong id="val-px-m">20.0 px/m</strong></div>
            <div class="prop-row"><span>Zoom:</span> <strong id="val-zoom">100%</strong></div>
        </div>

        <div class="card" id="selected-props" style="display: none;">
            <h3>Eigenschaften</h3>
            <div id="dynamic-props"></div>
        </div>
    </div>

    <!-- Modulare Scripte einbinden -->
    <script src="js/storage.js"></script>
    <script src="js/sprinklers.js"></script>
    <script src="js/lawn.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
